<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Temple Laundry Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --fg: #16203a;
  --muted: #4f5b78;
  --line: #dde2ec;
  --accent: #27408b;
  --on-accent: #ffffff;
  --today-bg: #eef2ff;
  --warn-bg: #fff4dc;
  --warn-fg: #7a4b00;
  --warn-line: #d9962b;
  --away-bg: #fdecea;
  --away-fg: #9c2f22;
  --cover-bg: #e3f3ea;
  --cover-fg: #1b6b43;
  --field: #7c879f;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1424;
    --surface: #182038;
    --fg: #eaeefb;
    --muted: #a3aecd;
    --line: #2a3556;
    --accent: #9db4ff;
    --on-accent: #0f1424;
    --today-bg: #1d2a54;
    --warn-bg: #3a2c0f;
    --warn-fg: #ffd58c;
    --warn-line: #e3a94a;
    --away-bg: #3d1a17;
    --away-fg: #ffb4a8;
    --cover-bg: #12301f;
    --cover-fg: #8fdcae;
    --field: #8a97b8;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  padding-block: max(28px, env(safe-area-inset-top, 0px)) max(40px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 8vw, 44px); line-height: 1.05; text-wrap: balance; }
h2, h3 { margin: 0; }
.head { display: flex; flex-direction: column; gap: 4px; }

.day:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.main-tabs { position: sticky; top: 0; z-index: 10; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: calc(8px + env(safe-area-inset-top, 0px)) 8px 8px; background: var(--bg); border-bottom: 1px solid var(--line); }
.main-tab { min-height: 48px; padding: 10px 16px; border: 0; border-radius: 10px; font: inherit; font-weight: 600; color: var(--fg); background: var(--surface); cursor: pointer; }
.main-tab[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
.main-tab:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.tab-panel { display: flex; flex-direction: column; gap: 18px; }
.range { font-size: 14px; color: var(--muted); }

.label { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; }
.label svg { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.backup-area { margin-top: 14px; padding-top: 28px; border-top: 1px solid var(--line); }
.backups { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; width: 100%; }
.backups h2 { font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.backup-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.backup { background: var(--today-bg); color: var(--accent); font-weight: 600; border-radius: 10px; padding: 10px 12px; overflow-wrap: anywhere; }
.backups p { margin: 0; font-size: 14px; color: var(--muted); }

.days { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; width: 100%; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.day.is-today { background: var(--today-bg); border: 2px solid var(--accent); padding: 13px; }
.day-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; }
.day-name { font-family: var(--font-display); font-weight: 700; font-size: 20px; }
.day-date { font-size: 14px; color: var(--muted); }
.pill { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 2px 9px; align-self: center; }
.shift { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; min-width: 0; }
.shift + .shift { border-top: 1px solid var(--line); padding-top: 12px; }
.shift .label { color: var(--muted); font-size: 11px; }
.who { font-weight: 600; overflow-wrap: anywhere; }
.who .gone { text-decoration: line-through; color: var(--muted); font-weight: 500; }
.chip { display: inline-block; font-size: 13px; font-weight: 600; border-radius: 999px; padding: 3px 10px; }
.chip.away { background: var(--away-bg); color: var(--away-fg); }
.chip.need { background: var(--warn-bg); color: var(--warn-fg); }
.chip.cover { background: var(--cover-bg); color: var(--cover-fg); }
.note { font-size: 13px; color: var(--muted); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; width: 100%; }
.panel h2 { font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.panel p { margin: 0; }
.instr-list, .note-list { display: flex; flex-direction: column; gap: 10px; }
.instr { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.instr summary { list-style: none; cursor: pointer; min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 14px; font-weight: 600; }
.instr summary::-webkit-details-marker { display: none; }
.instr summary::after { content: ""; flex: none; width: 9px; height: 9px; margin: -4px 4px 0 0; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); transition: transform 0.15s; }
.instr[open] summary { background: var(--today-bg); }
.instr[open] summary::after { transform: rotate(225deg); margin-top: 4px; }
.instr summary:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
.instr-body { padding: 8px 14px 6px; }
.instr-body p { margin: 0 0 8px; overflow-wrap: anywhere; }

.form { display: flex; flex-direction: column; gap: 12px; }
.load-notes { width: 100%; display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
.load-form { padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.load-form p { margin: 0; }
.load-checks { margin: 0; padding: 8px; border: 1px solid var(--line); border-radius: 10px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; min-width: 0; }
.load-checks legend { font-weight: 600; padding: 0 4px; }
.check-label { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 4px; min-height: 44px; font-size: 13px; cursor: pointer; }
.check-label input { width: 18px; height: 18px; accent-color: var(--accent); }
.check-label:focus-within { outline: 2px solid var(--accent); border-radius: 6px; }
.load-summary { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.load-summary strong { flex-basis: 100%; font-size: 14px; }
.pending { background: var(--bg); color: var(--muted); }
.legacy-notes { grid-column: 1 / -1; }
.load-form .btn-primary { padding-inline: 16px; }
.btn-outline:focus-visible, .btn-primary:focus-visible, .btn-small:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; }
.field input, .field textarea { box-sizing: border-box; width: 100%; padding: 10px 12px; border: 1px solid var(--field); border-radius: 10px; font: inherit; font-weight: 400; color: var(--fg); background: var(--surface); }
.field input { min-height: 44px; padding-block: 0; }
.field textarea { resize: vertical; }
.field input:focus-visible, .field textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
.photo-row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
.btn-outline { min-height: 44px; display: inline-flex; align-items: center; gap: 8px; padding: 0 14px; border: 1px solid var(--accent); border-radius: 10px; background: var(--surface); color: var(--accent); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
.btn-outline svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); border: 0; }
.thumb { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
.btn-primary { min-height: 48px; border: 0; border-radius: 10px; font: inherit; font-weight: 600; background: var(--accent); color: var(--on-accent); cursor: pointer; }
.btn-primary[disabled] { background: var(--line); color: var(--muted); cursor: default; }
.btn-small { align-self: flex-start; min-height: 44px; padding: 0 14px; border: 1px solid var(--accent); border-radius: 10px; background: var(--surface); color: var(--accent); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
.entry { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.entry-head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.entry-who { font-weight: 600; overflow-wrap: anywhere; }
.entry-time { font-size: 13px; color: var(--muted); }
.entry-text { white-space: pre-wrap; overflow-wrap: anywhere; }
.entry-photo { width: 100%; max-height: 360px; object-fit: contain; border-radius: 10px; background: var(--bg); }
.chip.note-kind { background: var(--today-bg); color: var(--accent); font-size: 12px; padding: 2px 9px; }
.chip.q { font-size: 12px; padding: 2px 9px; }
@media (min-width: 760px) {
  .days { gap: 12px; }
  .day { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 20px; }
  .day-head, .day > .note { grid-column: 1 / -1; }
  .day > .shift + .shift { border-top: 0; padding-top: 0; border-left: 1px solid var(--line); padding-left: 20px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div class="eyebrow">Sri Radha Kalachandji Temple</div>
    <h1>Laundry Service</h1>
  </header>

  <nav class="main-tabs" role="tablist" aria-label="Laundry service">
    <button class="main-tab" id="schedule-tab" role="tab" type="button" aria-selected="true" aria-controls="schedule-panel" tabindex="0">Schedule</button>
    <button class="main-tab" id="instructions-tab" role="tab" type="button" aria-selected="false" aria-controls="instructions-panel" tabindex="-1">Instructions</button>
  </nav>

  <div class="tab-panel" id="schedule-panel" role="tabpanel" aria-labelledby="schedule-tab">
  <div class="range" id="range"></div>

  <ul class="days" id="days" aria-label="Daily schedule"></ul>

  <div class="backup-area">
  <section class="backups" aria-labelledby="backups-h">
    <h2 id="backups-h">Permanent backups</h2>
    <div class="backup-list" id="backup-list"></div>
    <p>Call a backup first when a shift needs cover.</p>
  </section>
  </div>

  </div>

  <div class="tab-panel" id="instructions-panel" role="tabpanel" aria-labelledby="instructions-tab" hidden>
  <section class="panel" id="instructions" aria-labelledby="instr-h">
    <h2 id="instr-h">Service instructions</h2>
    <div class="instr-list" id="instr-list"></div>
  </section>
  </div>
</div>

<script>
/* ==========================================================================
   EDIT THIS SECTION TO UPDATE THE SCHEDULE
   ========================================================================== */

/* Permanent backups. Replace with real names. */
var BACKUPS = ["Backup One", "Backup Two"];

/* Weekly plan, Monday first. Each shift lists the people on it.
   An empty list means the shift needs a volunteer. */
var WEEKLY_PLAN = [
  { day: "Monday",    am: ["Hema Sirasha"],            pm: ["Swetha"] },
  { day: "Tuesday",   am: ["Sangeeta Patel"],          pm: ["Shilpa"] },
  { day: "Wednesday", am: ["Divya Rupini"],            pm: ["Ajinkya"] },
  { day: "Thursday",  am: ["Sulakshna"],               pm: ["Vishaka"] },
  { day: "Friday",    am: ["Hema"],                    pm: [] },
  { day: "Saturday",  am: ["Renuka"],                  pm: ["Kalyani"] },
  { day: "Sunday",    am: ["Sreeja", "Padma Sakhi"],   pm: ["Roopal", "Sulakshna"] }
];

/* Planned absences. One line per absence, dates as YYYY-MM-DD.
   person : name exactly as written above
   from/to: first and last day away (same date for one day)
   shifts : "am", "pm", or "both" (optional, default "both")
   cover  : who is covering, for example "Backup One" (optional)
   note   : short message for the group (optional)

   Example:
   { person: "Sreeja", from: "2026-11-08", to: "2026-11-08", shifts: "am", cover: "Backup One", note: "Travelling" }
*/
var ABSENCES = [
];

/* Service instructions shown on the page. One entry per topic.
   body: a list of short paragraphs. Leave it empty ([]) to show "Instructions coming soon." */
var INSTRUCTIONS = [
  { title: "Before you start", body: [] },
  { title: "Washing", body: [] },
  { title: "Drying", body: [
    "Change the lint filter in the dryer."
  ] },
  { title: "Folding", body: [] },
  { title: "Machines", body: [] },
  { title: "Supplies", body: [] },
  { title: "If you can't make your shift", body: [
    "Tell the group early so a backup can be arranged.",
    "Call a backup first when a shift needs cover."
  ] },
  { title: "New clothes and rule changes", body: [] }
];

/* ==========================================================================
   Page code. No need to edit below this line.
   ========================================================================== */

var SUN_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
var MOON_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';

/* Updates are saved on this device. Legacy notes remain readable. */
var LS_LOADS = "tls.loads.v1";
var LS_NOTES = "tls.notes.v1";
var LS_NAME = "tls.name";
function lsGet(key, fallback) {
  try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
}
function lsSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch (e) { return false; }
}
function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function iso(d) {
  var m = String(d.getMonth() + 1).padStart(2, "0");
  var day = String(d.getDate()).padStart(2, "0");
  return d.getFullYear() + "-" + m + "-" + day;
}
function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
function fmt(d, opts) { return d.toLocaleDateString(undefined, opts); }

function absencesFor(dateIso, shift, person) {
  return ABSENCES.filter(function (a) {
    var s = a.shifts || "both";
    return a.person === person && dateIso >= a.from && dateIso <= a.to && (s === "both" || s === shift);
  });
}

function renderShift(dateIso, shiftKey, people) {
  var box = el("div", "shift");
  var label = el("div", "label");
  label.innerHTML = (shiftKey === "am" ? SUN_SVG : MOON_SVG);
  label.appendChild(document.createTextNode(shiftKey === "am" ? "Morning" : "Evening"));
  box.appendChild(label);

  if (people.length === 0) {
    box.appendChild(el("div", "who", "Nobody yet"));
    box.appendChild(el("span", "chip need", "Needs a volunteer"));
    return box;
  }
  var who = el("div", "who");
  var allAway = true;
  var covers = [];
  var notes = [];
  people.forEach(function (p, i) {
    var abs = absencesFor(dateIso, shiftKey, p);
    var span = el("span", abs.length ? "gone" : "", p);
    if (i > 0) who.appendChild(document.createTextNode(" & "));
    who.appendChild(span);
    if (abs.length) {
      abs.forEach(function (a) {
        if (a.cover && covers.indexOf(a.cover) < 0) covers.push(a.cover);
        if (a.note) notes.push(p + ": " + a.note);
      });
    } else {
      allAway = false;
    }
  });
  box.appendChild(who);
  var anyAway = people.some(function (p) { return absencesFor(dateIso, shiftKey, p).length > 0; });
  if (anyAway) {
    box.appendChild(el("span", "chip away", "Away"));
    if (covers.length) box.appendChild(el("span", "chip cover", covers.join(" & ") + " covering"));
    else if (allAway) box.appendChild(el("span", "chip need", "Needs cover"));
    notes.forEach(function (n) { box.appendChild(el("div", "note", n)); });
  }

  return box;
}

function render() {
  var today = startOfDay(new Date());
  var firstDay = addDays(today, -1);
  var lastDay = addDays(today, 6);

  document.getElementById("range").textContent =
    fmt(firstDay, { month: "short", day: "numeric" }) + " to " + fmt(lastDay, { month: "short", day: "numeric" });

  var list = document.getElementById("days");
  list.textContent = "";
  var todayIso = iso(today);

  for (var i = 0; i < 8; i++) {
    var d = addDays(firstDay, i);
    var plan = WEEKLY_PLAN[(d.getDay() + 6) % 7];
    var dIso = iso(d);
    var li = el("li", "day" + (dIso === todayIso ? " is-today" : ""));
    var head = el("div", "day-head");
    head.appendChild(el("h3", "day-name", plan.day));
    head.appendChild(el("span", "day-date", fmt(d, { month: "short", day: "numeric" })));
    if (i === 0) head.appendChild(el("span", "pill", "Yesterday"));
    if (dIso === todayIso) head.appendChild(el("span", "pill", "Today"));
    li.appendChild(head);
    ["am", "pm"].forEach(function (shiftKey) {
      var shift = renderShift(dIso, shiftKey, plan[shiftKey]);
      shift.appendChild(renderLoadNotes(dIso, shiftKey));
      li.appendChild(shift);
    });
    var legacy = lsGet(LS_NOTES, []).filter(function (n) { return n.date === dIso; });
    if (legacy.length) {
      var oldNotes = el("div", "legacy-notes note-list");
      legacy.forEach(function (n) { oldNotes.appendChild(renderUpdate(n)); });
      li.appendChild(oldNotes);
    }
    list.appendChild(li);
  }


}

/* ---- Service instructions ---- */
function renderInstructions() {
  var box = document.getElementById("instr-list");
  box.textContent = "";
  INSTRUCTIONS.forEach(function (it, i) {
    var d = el("details", "instr");
    if (i === 0) d.open = true;
    d.appendChild(el("summary", null, it.title));
    var body = el("div", "instr-body");
    var lines = it.body && it.body.length ? it.body : ["Instructions coming soon."];
    lines.forEach(function (t) { body.appendChild(el("p", null, t)); });
    d.appendChild(body);
    box.appendChild(d);
  });
}

/* ---- Load updates ---- */
var LOADS = [["kitchen", "Kitchen load"], ["pujari", "Pujari load"], ["deity", "Deity load"]];
var STAGES = [["washed", "Washed"], ["dried", "Dried"], ["folded", "Folded"]];
function loadUpdates() { return lsGet(LS_LOADS, []); }
function renderUpdate(entry) {
  var card = el("div", "entry");
  var head = el("div", "entry-head");
  head.appendChild(el("span", "entry-who", entry.who || "Volunteer"));
  head.appendChild(el("span", "entry-time", new Date(entry.time).toLocaleTimeString(undefined, {hour: "numeric", minute: "2-digit"})));
  if (entry.kind === "question") head.appendChild(el("span", "chip need", "Question"));
  card.appendChild(head);
  if (entry.loads) LOADS.forEach(function (load) {
    var row = el("div", "load-summary");
    row.appendChild(el("strong", null, load[1]));
    STAGES.forEach(function (stage) {
      var checked = entry.loads[load[0]] && entry.loads[load[0]][stage[0]] === true;
      row.appendChild(el("span", "chip " + (checked ? "cover" : "pending"), stage[1] + (checked ? " ✓" : " —")));
    });
    card.appendChild(row);
  });
  if (entry.text) card.appendChild(el("div", "entry-text", entry.text));
  var photos = entry.photos || (entry.photo ? [entry.photo] : []);
  photos.forEach(function (url) {
    if (String(url).indexOf("data:image/jpeg;base64,") !== 0) return;
    var image = el("img", "entry-photo");
    image.src = url; image.alt = "Laundry photo from " + (entry.who || "Volunteer");
    card.appendChild(image);
  });
  return card;
}
function renderLoadNotes(dateIso, shiftKey) {
  var box = el("div", "load-notes");
  var button = el("button", "btn-small", "Add Notes");
  button.type = "button";
  var formId = "update-" + dateIso + "-" + shiftKey;
  button.setAttribute("aria-expanded", "false");
  button.setAttribute("aria-controls", formId);
  button.setAttribute("aria-label", "Add Notes for " + dateIso + " " + (shiftKey === "am" ? "morning" : "evening"));
  box.appendChild(button);
  var form = el("form", "form load-form"); form.id = formId; form.hidden = true;
  var caption = el("p", "note", "Check what you completed. Unchecked items mean not reported in this update.");
  form.appendChild(caption);
  var nameLabel = el("label", "field", "Your name");
  var name = el("input"); name.type = "text"; name.autocomplete = "name"; name.maxLength = 60; name.value = lsGet(LS_NAME, "");
  nameLabel.appendChild(name); form.appendChild(nameLabel);
  var checks = {};
  LOADS.forEach(function (load) {
    var group = el("fieldset", "load-checks"); group.appendChild(el("legend", null, load[1]));
    checks[load[0]] = {};
    STAGES.forEach(function (stage) {
      var label = el("label", "check-label");
      var input = el("input"); input.type = "checkbox";
      input.setAttribute("aria-label", load[1] + " " + stage[1].toLowerCase());
      checks[load[0]][stage[0]] = input;
      label.appendChild(input); label.appendChild(document.createTextNode(stage[1])); group.appendChild(label);
    });
    form.appendChild(group);
  });
  var textLabel = el("label", "field", "Notes (optional)");
  var text = el("textarea"); text.rows = 3; text.maxLength = 1000; text.placeholder = "Anything the next volunteer should know?";
  textLabel.appendChild(text); form.appendChild(textLabel);
  var photoLabel = el("label", "field", "Photos (optional)");
  var file = el("input"); file.type = "file"; file.accept = "image/*"; file.multiple = true;
  photoLabel.appendChild(file); form.appendChild(photoLabel);
  var previews = el("div", "photo-row"); form.appendChild(previews);
  var photos = [], processing = false;
  var status = el("div", "note"); status.setAttribute("role", "status");
  var actions = el("div", "photo-row");
  var submit = el("button", "btn-primary", "Submit Notes"); submit.type = "submit";
  var cancel = el("button", "btn-outline", "Cancel"); cancel.type = "button";
  actions.appendChild(submit); actions.appendChild(cancel); form.appendChild(actions); form.appendChild(status);
  box.appendChild(form);
  var list = el("div", "note-list"); box.appendChild(list);
  var saved = el("div", "note"); saved.setAttribute("role", "status"); box.appendChild(saved);
  function refreshSummary() {
    list.textContent = "";
    loadUpdates().filter(function (n) { return n.date === dateIso && n.shift === shiftKey; })
      .forEach(function (n) { list.appendChild(renderUpdate(n)); });
  }
  function close() { form.hidden = true; button.setAttribute("aria-expanded", "false"); button.focus(); }
  button.addEventListener("click", function () {
    form.hidden = !form.hidden; button.setAttribute("aria-expanded", String(!form.hidden));
    if (!form.hidden) name.focus();
  });
  cancel.addEventListener("click", close);
  function showPhotos() {
    previews.textContent = "";
    photos.forEach(function (url, index) {
      var holder = el("div", "photo-row"); var image = el("img", "thumb"); image.src = url; image.alt = "Attached photo " + (index + 1);
      var remove = el("button", "btn-outline", "Remove photo " + (index + 1)); remove.type = "button";
      remove.addEventListener("click", function () { photos.splice(index, 1); showPhotos(); });
      holder.appendChild(image); holder.appendChild(remove); previews.appendChild(holder);
    });
  }
  file.addEventListener("change", async function () {
    processing = true; submit.disabled = true; file.disabled = true; status.textContent = "Preparing photos…";
    var failures = 0;
    for (var selected of Array.from(file.files || [])) {
      var url = await new Promise(function (resolve) { downscale(selected, resolve); });
      if (url) photos.push(url); else failures++;
    }
    showPhotos(); file.value = ""; file.disabled = false; processing = false; submit.disabled = false;
    status.textContent = failures ? "Some photos could not be read. Please try them again." : "";
  });
  form.addEventListener("submit", function (event) {
    event.preventDefault(); if (processing) return;
    var loads = {}, any = false;
    LOADS.forEach(function (load) {
      loads[load[0]] = {};
      STAGES.forEach(function (stage) { var checked = checks[load[0]][stage[0]].checked === true; loads[load[0]][stage[0]] = checked; any = any || checked; });
    });
    if (!any && !text.value.trim() && !photos.length) { status.textContent = "Check a completed task, add a note, or attach a photo."; return; }
    var entry = {id: Date.now(), date: dateIso, shift: shiftKey, who: name.value.trim() || "Volunteer", loads: loads, text: text.value.trim(), photos: photos.slice(), time: new Date().toISOString()};
    if (!lsSet(LS_LOADS, [entry].concat(loadUpdates()))) { status.textContent = "Could not save. Device storage may be full. Remove a photo and try again; your draft is still here."; return; }
    lsSet(LS_NAME, name.value.trim());
    LOADS.forEach(function (load) { STAGES.forEach(function (stage) { checks[load[0]][stage[0]].checked = false; }); });
    text.value = ""; photos = []; showPhotos(); status.textContent = "";
    refreshSummary(); close(); saved.textContent = "Saved on this device. Other volunteers cannot see this update yet.";
  });
  refreshSummary();
  return box;
}

function downscale(file, cb) {
  var reader = new FileReader();
  reader.onload = function () {
    var img = new Image();
    img.onload = function () {
      var s = Math.min(1, 800 / Math.max(img.width, img.height));
      var c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.width * s));
      c.height = Math.max(1, Math.round(img.height * s));
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL("image/jpeg", 0.7));
    };
    img.onerror = function () { cb(null); };
    img.src = reader.result;
  };
  reader.onerror = function () { cb(null); };
  reader.readAsDataURL(file);
}

/* ---- Main navigation ---- */
function initTabs() {
  var tabs = [document.getElementById("schedule-tab"), document.getElementById("instructions-tab")];
  function selectTab(index, focus) {
    tabs.forEach(function (tab, i) {
      var selected = i === index;
      tab.setAttribute("aria-selected", selected ? "true" : "false");
      tab.tabIndex = selected ? 0 : -1;
      document.getElementById(tab.getAttribute("aria-controls")).hidden = !selected;
    });
    if (focus) tabs[index].focus();
  }
  tabs.forEach(function (tab, index) {
    tab.addEventListener("click", function () { selectTab(index, false); });
    tab.addEventListener("keydown", function (event) {
      var next;
      if (event.key === "ArrowRight") next = (index + 1) % tabs.length;
      else if (event.key === "ArrowLeft") next = (index + tabs.length - 1) % tabs.length;
      else if (event.key === "Home") next = 0;
      else if (event.key === "End") next = tabs.length - 1;
      else return;
      event.preventDefault();
      selectTab(next, true);
    });
  });
}

(function init() {
  initTabs();
  var bl = document.getElementById("backup-list");
  BACKUPS.forEach(function (b) { bl.appendChild(el("div", "backup", b)); });
  renderInstructions();
  render();
})();
</script>
